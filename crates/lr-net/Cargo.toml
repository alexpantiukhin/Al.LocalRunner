[package]
name = "lr-net"
version = "0.3.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
lr-core.workspace = true
lr-abstractions.workspace = true
lr-proto.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_NetworkManagement_NetManagement"] }

[dev-dependencies]
lr-abstractions = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tempfile.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
