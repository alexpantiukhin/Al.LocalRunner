[package]
name = "lr-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "localrunner"
path = "src/main.rs"

[[bin]]
name = "localrunnerw"
path = "src/bin/localrunnerw.rs"

[dependencies]
lr-core.workspace = true
lr-abstractions.workspace = true
lr-proto.workspace = true
lr-net.workspace = true
lr-store.workspace = true
lr-exec.workspace = true
lr-obs.workspace = true
lr-broker.workspace = true
lr-hub.workspace = true
lr-runner.workspace = true
lr-dashboard.workspace = true
clap.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Services", "Win32_System_Console", "Win32_System_RemoteDesktop"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rusqlite.workspace = true
lr-abstractions = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "test-util"] }
