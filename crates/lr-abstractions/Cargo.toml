[package]
name = "lr-abstractions"
version = "0.4.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
lr-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros"] }

[features]
test-support = ["tokio/rt"]

[[test]]
name = "fakes"
required-features = ["test-support"]

[[test]]
name = "clock"
required-features = ["test-support"]

[[test]]
name = "transport"
required-features = ["test-support"]

[[test]]
name = "process"
required-features = ["test-support"]

[[test]]
name = "process_stop"
required-features = ["test-support"]

[[test]]
name = "edges"
required-features = ["test-support"]

[[test]]
name = "store_broker"
required-features = ["test-support"]

[[test]]
name = "store_hub_runner"
required-features = ["test-support"]
