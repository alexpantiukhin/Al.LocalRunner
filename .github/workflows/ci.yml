name: ci
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      docs: ${{ steps.f.outputs.docs }}
      plugin: ${{ steps.f.outputs.plugin }}
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            files="$(git ls-files)"
          else
            files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          fi
          echo "$files"
          hit() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          {
            echo "rust=$(hit '^(crates/|install/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|deny\.toml$|\.github/workflows/ci\.yml$|\.github/test-budgets\.toml$|\.github/scripts/test_budget\.py$)')"
            echo "docs=$(hit '^(README(\.ru)?\.md$|docs/|plugin/|AGENTS\.md$|\.github/workflows/ci\.yml$)')"
            echo "plugin=$(hit '^(plugin/|\.claude-plugin/|\.agents/)')"
            echo "workflows=$(hit '^(\.github/workflows/|\.github/scripts/(test_)?release_notes\.py$)')"
          } >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Loopback aliases (macOS has only 127.0.0.1)
        if: runner.os == 'macOS'
        run: for a in 127.0.0.2 127.0.0.3 127.0.0.4 127.0.0.5 127.0.0.9; do sudo ifconfig lo0 alias $a up; done
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python .github/scripts/test_budget.py cargo test --workspace --locked --no-fail-fast
        env:
          TEST_BUDGET_UNIT_S: ${{ vars.TEST_BUDGET_UNIT_S }}
          TEST_BUDGET_INTEGRATION_S: ${{ vars.TEST_BUDGET_INTEGRATION_S }}
          TEST_BUDGET_E2E_S: ${{ vars.TEST_BUDGET_E2E_S }}

  skills:
    needs: changes
    if: needs.changes.outputs.plugin == 'true' && needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test -p lr-cli --locked --test skills_lint

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README pair and architecture pair stay parallel
        run: python3 .github/scripts/docs_pair.py

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No control characters in a workflow file
        run: python3 .github/scripts/workflow_control_chars.py
      - name: Release notes script
        run: python3 -m unittest discover -s .github/scripts -p test_release_notes.py
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  ci-ok:
    if: always()
    needs: [changes, rust, skills, docs, workflows]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
