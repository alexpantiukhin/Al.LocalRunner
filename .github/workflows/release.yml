name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, ext: tar.gz, triple: x86_64-unknown-linux-musl }
          - { target: linux-arm64, os: ubuntu-24.04-arm, ext: tar.gz, triple: aarch64-unknown-linux-musl }
          - { target: macos-arm64, os: macos-latest, ext: tar.gz }
          - { target: macos-x64, os: macos-15-intel, ext: tar.gz }
          - { target: windows-x64, os: windows-latest, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Build (static musl)
        if: matrix.triple
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.triple }}
          cargo build --release --locked -p lr-cli --target ${{ matrix.triple }}
          mkdir -p target/release
          cp target/${{ matrix.triple }}/release/localrunner target/release/localrunner
      - name: Build
        if: ${{ !matrix.triple }}
        run: cargo build --release --locked -p lr-cli
      - name: Binary version matches the tag
        shell: bash
        run: |
          exe=target/release/localrunner
          [ -x "$exe.exe" ] && exe="$exe.exe"
          got=$("$exe" --version | awk '{print $2}')
          want="${GITHUB_REF_NAME#v}"
          if [ "$got" != "$want" ]; then echo "binary reports $got, tag is $GITHUB_REF_NAME"; exit 1; fi
      - name: Pack (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          mkdir dist
          tar -czf "dist/al-localrunner-${{ matrix.target }}.tar.gz" -C target/release localrunner
      - name: Pack (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path target/release/localrunner.exe, target/release/localrunnerw.exe -DestinationPath dist/al-localrunner-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  image:
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by arch
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build -f install/Dockerfile --push             -t "${repo}:${GITHUB_REF_NAME#v}-${{ matrix.arch }}" .

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-arch tag
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "${repo}:${v}" "${repo}:${v}-amd64" "${repo}:${v}-arm64"

  sign-and-publish:
    needs: [build, image-manifest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Install scripts with the release public key
        env:
          RELEASE_PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJuy6/QUZNtaQ5Zq26RMxU6aEEO0UoEE8B8Fud5jL8kg al-localrunner-release"
        run: |
          for f in install.sh install.ps1; do
            awk -v key="$RELEASE_PUBKEY" '{ gsub(/@RELEASE_PUBKEY@/, key); print }' "src/install/$f" > "dist/$f"
            if grep -q '@RELEASE_PUBKEY@' "dist/$f"; then echo "placeholder left in $f"; exit 1; fi
          done
          chmod 0755 dist/install.sh
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          sed -E "s#^( *image:).*#\1 ${repo}:${GITHUB_REF_NAME#v}#; /^ *build:/,/dockerfile:/d" src/install/compose.yaml > dist/compose.yaml
      - name: Sums
        working-directory: dist
        run: sha256sum al-localrunner-* install.sh install.ps1 compose.yaml > SHA256SUMS
      - name: Sign
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release_key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          ssh-keygen -Y sign -f "$key" -n al-localrunner-release SHA256SUMS
          rm -f "$key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in
            *-*) pre="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* $pre \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
