[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
lr-core = { path = "crates/lr-core" }
lr-abstractions = { path = "crates/lr-abstractions" }
lr-proto = { path = "crates/lr-proto" }
lr-net = { path = "crates/lr-net" }
lr-store = { path = "crates/lr-store" }
lr-exec = { path = "crates/lr-exec" }
lr-obs = { path = "crates/lr-obs" }
lr-broker = { path = "crates/lr-broker" }
lr-hub = { path = "crates/lr-hub" }
lr-runner = { path = "crates/lr-runner" }
lr-dashboard = { path = "crates/lr-dashboard" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
