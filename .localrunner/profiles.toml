[profile.rust-unit]
command   = "python .github/scripts/test_budget.py cargo test --workspace --locked --no-fail-fast"
timeout_s = 1800
mem_mb    = 8192
cpu       = 4
tags      = ["cargo"]
cache     = ["target"]

[profile.rust-build]
command   = "cargo build -p lr-cli --locked"
timeout_s = 1200
mem_mb    = 8192
cpu       = 4
tags      = ["cargo"]
cache     = ["target"]

[profile.rust-test-all]
command   = "cargo test --workspace --locked --no-fail-fast -j 2"
timeout_s = 1800
mem_mb    = 5120
cpu       = 2
tags      = ["cargo"]
cache     = ["target"]

[profile.skills-lint]
command   = "cargo test -p lr-cli --locked --test skills_lint"
timeout_s = 600
mem_mb    = 4096
cpu       = 2
tags      = ["cargo"]
cache     = ["target"]

[profile.rust-gate]
timeout_s = 3600
mem_mb    = 8192
cpu       = 4
tags      = ["cargo"]
cache     = ["target"]
steps = [
  { name = "fmt",    command = "cargo fmt --check",                                       timeout_s = 120 },
  { name = "clippy", command = "cargo clippy --workspace --all-targets --locked -- -D warnings", timeout_s = 1200 },
  { name = "test",   command = "python .github/scripts/test_budget.py cargo test --workspace --locked --no-fail-fast",          timeout_s = 1800 },
]

[profile.rust-fmt]
command   = "cargo fmt --check"
timeout_s = 120
mem_mb    = 1024
cpu       = 1
tags      = ["cargo"]

[profile.rust-fmt-fix]
command   = "cargo fmt --all"
timeout_s = 120
mem_mb    = 1024
cpu       = 1
tags      = ["cargo"]

[profile.ci-docs]
command   = "python .github/scripts/docs_pair.py"
timeout_s = 60
mem_mb    = 256
cpu       = 1

[profile.ci-workflows]
timeout_s = 300
mem_mb    = 512
cpu       = 1
steps = [
  { name = "control-chars", command = "python .github/scripts/workflow_control_chars.py", timeout_s = 60 },
  { name = "release-notes", command = "python -m unittest discover -s .github/scripts -p test_release_notes.py", timeout_s = 60 },
  { name = "version-only",  command = "python -m unittest discover -s .github/scripts -p test_version_only.py", timeout_s = 60 },
  { name = "actionlint",    command = "docker run --rm -v \".:/repo\" --workdir /repo rhysd/actionlint:1.7.7 -color", timeout_s = 240 },
]

[profile.rust-test]
command   = "cargo test --locked --no-fail-fast -j 2 {? -p {pkg}} {? --features {features}} {? --{target}} {? --test {test}} {? {filter}}"
timeout_s = 1800
mem_mb    = 8192
cpu       = 4
tags      = ["cargo"]
cache     = ["target"]

[profile.rust-deny]
command   = "cargo deny check licenses"
timeout_s = 600
mem_mb    = 1024
cpu       = 1
tags      = ["cargo"]

[profile.rust-test.args.pkg]
pattern = "[a-z0-9_-]+"

[profile.rust-test.args.test]
pattern = "[a-z0-9_]+"

[profile.rust-test.args.target]
pattern = "lib|bins|doc"

[profile.rust-test.args.features]
pattern = "[a-z0-9_,-]+"

[profile.rust-test.args.filter]
pattern = "[A-Za-z0-9_:]+"

[profile.rust-clippy]
command   = "cargo clippy --workspace --all-targets --locked -- -D warnings"
timeout_s = 1200
mem_mb    = 8192
cpu       = 4
tags      = ["cargo"]
cache     = ["target"]

# Remote zone: the VPS runner. The code is fetched from GitHub, so the branch must be pushed and
# passed as --arg ref=<branch> (or a commit SHA).

[profile.rust-fmt.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-clippy.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-unit.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-test-all.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-test.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-build.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-deny.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.skills-lint.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.ci-docs.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-gate.args.ref]
pattern = "[A-Za-z0-9._/-]+"

[profile.rust-fmt.zone.remote]
command = 'umask 022 && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && cargo fmt --check'

[profile.rust-clippy.zone.remote]
command = 'umask 022 && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && cargo clippy --workspace --all-targets --locked -- -D warnings'

[profile.rust-unit.zone.remote]
command = 'umask 022 && export TMPDIR=$(mktemp -d /tmp/lr.XXXXXX) && trap "rm -rf $TMPDIR" EXIT && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && python3 .github/scripts/test_budget.py cargo test --workspace --locked --no-fail-fast'

[profile.rust-test-all.zone.remote]
command = 'umask 022 && export TMPDIR=$(mktemp -d /tmp/lr.XXXXXX) && trap "rm -rf $TMPDIR" EXIT && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && cargo test --workspace --locked --no-fail-fast -j 2'

[profile.rust-test.zone.remote]
command = 'umask 022 && export TMPDIR=$(mktemp -d /tmp/lr.XXXXXX) && trap "rm -rf $TMPDIR" EXIT && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && cargo test --locked --no-fail-fast -j 2 {? -p {pkg}} {? --features {features}} {? --{target}} {? --test {test}} {? {filter}}'

[profile.rust-build.zone.remote]
command = 'umask 022 && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && cargo build -p lr-cli --locked'

[profile.rust-deny.zone.remote]
command = 'umask 022 && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && cargo deny check licenses'

[profile.skills-lint.zone.remote]
command = 'umask 022 && export TMPDIR=$(mktemp -d /tmp/lr.XXXXXX) && trap "rm -rf $TMPDIR" EXIT && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && cargo test -p lr-cli --locked --test skills_lint'

[profile.ci-docs.variant.vps]
when    = { zone = ["remote"], tags = ["cargo"] }
command = 'umask 022 && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && python3 .github/scripts/docs_pair.py'

[profile.rust-gate.zone.remote]
steps = [
  { name = "fmt",    command = 'umask 022 && git init -q . && git fetch -q --depth 1 https://github.com/alexpantiukhin/Al.LocalRunner.git {ref} && git checkout -q FETCH_HEAD && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && cargo fmt --check', timeout_s = 300 },
  { name = "clippy", command = 'umask 022 && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && cargo clippy --workspace --all-targets --locked -- -D warnings', timeout_s = 1200 },
  { name = "test",   command = 'umask 022 && export TMPDIR=$(mktemp -d /tmp/lr.XXXXXX) && trap "rm -rf $TMPDIR" EXIT && export CARGO_TARGET_DIR="$LOCALRUNNER_CACHE_TARGET" && python3 .github/scripts/test_budget.py cargo test --workspace --locked --no-fail-fast', timeout_s = 1800 },
]
